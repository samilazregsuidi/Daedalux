name: Daedalux CI

on:
  workflow_dispatch:
  push:
    branches: ['alpha' ]
  pull_request:
    branches: ['alpha' ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        preset: [release, debug]
    runs-on: ${{ matrix.os }}
    env:
      CMAKE_EXPORT_COMPILE_COMMANDS: "ON"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup CMake
        uses: lukka/get-cmake@v3
        with:
          cmake-version: '3.24.0'

      - name: Configure (${{ matrix.preset }})
        run: cmake --preset ${{ matrix.preset }}

      - name: Build (${{ matrix.preset }})
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Run Tests (${{ matrix.preset }})
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

      - name: Upload compile_commands.json
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: compile-commands-${{ matrix.os }}-${{ matrix.preset }}
          path: ${{ matrix.preset == 'release' && 'build/compile_commands.json' || 'build-debug/compile_commands.json' }}

      - name: Upload Test Logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.preset }}
          path: ${{ matrix.preset == 'release' && 'build/Testing/Temporary' || 'build-debug/Testing/Temporary' }}

