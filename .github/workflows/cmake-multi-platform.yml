name: Daedalux CI

on:
  workflow_dispatch:
  push:
    branches: [ main, v1, alpha ]
  pull_request:
    branches: [ main, v1, alpha ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        preset: [debug, release]

    runs-on: ${{ matrix.os }}
    env:
      CMAKE_EXPORT_COMPILE_COMMANDS: "ON"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CMake
        uses: lukka/get-cmake@v2
        with:
          cmake-version: '3.24.0'

      - name: Configure (${ matrix.preset })
        run: cmake --preset ${{ matrix.preset }}

      - name: Build (${ matrix.preset })
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Run Tests (${ matrix.preset })
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

      - name: Upload compile_commands.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-commands-${{ matrix.os }}-${{ matrix.preset }}
          path: ${{ matrix.preset == 'release' && 'build/compile_commands.json' || 'build-debug/compile_commands.json' }}

      - name: Upload Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.preset }}
          path: ${{ matrix.preset == 'release' && 'build/Testing/Temporary' || 'build-debug/Testing/Temporary' }}
